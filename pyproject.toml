[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-of-agents"
version = "0.1.0"
description = "Agent-friendly Raspberry Pi GPIO control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=14,<17",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
dev = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]
pi = ["gpiozero>=2,<3"]

[project.scripts]
hoa-server = "hand_of_agents.server.app:main"
hoa-client = "hand_of_agents.client.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hand_of_agents = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
