<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Hand of Agents</title>
    <link rel="stylesheet" href="/static/styles.css?v=16">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GPIO CONTROL PLANE</p>
          <h1>Hand of Agents</h1>
        </div>
        <div class="header-actions">
          <span id="server-status" class="status status-waiting">正在连接</span>
          <button id="settings-button" class="button button-quiet" type="button">认证设置</button>
        </div>
      </header>

      <main>
        <section class="summary" aria-label="系统摘要">
          <article><span>节点总数</span><strong id="node-count">0</strong></article>
          <article><span>在线节点</span><strong id="online-count">0</strong></article>
          <article><span>在线输出</span><strong id="output-count">0</strong></article>
          <article><span>最后刷新</span><strong id="last-refresh">—</strong></article>
        </section>

        <section class="section-heading">
          <div>
            <p class="eyebrow">LIVE NODES</p>
            <h2>树莓派节点</h2>
          </div>
          <button id="refresh-button" class="button" type="button">立即刷新</button>
        </section>

        <section id="nodes" class="nodes" aria-live="polite">
          <div class="empty-state">尚未发现节点，等待 Client 建立连接。</div>
        </section>
      </main>
    </div>

    <dialog id="key-dialog">
      <form method="dialog" id="key-form">
        <p class="eyebrow">CONTROL AUTHORIZATION</p>
        <h2>设置 Agent API 密钥</h2>
        <p class="dialog-copy">当前局域网模式无需填写。启用 <code>HOA_AUTH_MODE=api_key</code> 后，密钥仅保存在本浏览器并通过请求头发送。</p>
        <label for="api-key">API 密钥</label>
        <input id="api-key" name="api-key" type="password" autocomplete="off" placeholder="输入 HOA_API_KEY">
        <div class="dialog-actions">
          <button class="button button-quiet" value="cancel" type="submit">取消</button>
          <button id="save-key" class="button" value="default" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="pin-dialog" class="pin-dialog">
      <form method="dialog">
        <div class="pin-dialog-heading">
          <div>
            <p class="eyebrow" id="pin-physical">PHYSICAL PIN</p>
            <h2 id="pin-dialog-title">GPIO 高级设置</h2>
            <p class="dialog-copy" id="pin-function"></p>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
        </div>

        <div class="pin-config-grid">
          <label for="pin-mode">引脚模式
            <select id="pin-mode">
              <option value="unconfigured">未占用（推荐）</option>
              <option value="input">输入</option>
              <option value="output">输出</option>
            </select>
          </label>
          <label for="pin-pull">输入上下拉
            <select id="pin-pull">
              <option value="floating">浮空</option>
              <option value="up">上拉</option>
              <option value="down">下拉</option>
            </select>
          </label>
          <label for="pin-pulse-hz">PULSE 频率
            <span class="input-with-unit">
              <input id="pin-pulse-hz" type="number" min="0.1" max="10" step="0.1" value="1">
              <span>Hz</span>
            </span>
          </label>
        </div>

        <div class="level-control">
          <p>输出电平（确认后生效）</p>
          <div class="pin-actions">
            <button class="button button-quiet pin-level-command" data-level="high" aria-pressed="false" type="button">HIGH</button>
            <button class="button button-quiet pin-level-command" data-level="low" aria-pressed="false" type="button">LOW</button>
            <button class="button button-quiet pin-level-command" data-level="pulse" aria-pressed="false" type="button">连续 PULSE</button>
          </div>
        </div>
        <p class="pin-warning">弹窗内的修改仅暂存；点击“确认”后才会提交。切换为输出时，请先确认外部电路允许所选电平。</p>
        <button id="apply-pin-config" class="button full-button" type="button">确认</button>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/static/app.js?v=16"></script>
  </body>
</html>
